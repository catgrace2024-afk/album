<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14161a">
<title>写真</title>
<style>
  :root{
    --bg:#14161a; --panel:#1e2128; --line:#2e3340;
    --fg:#eceef2; --dim:#9aa3b2; --accent:#5b9cf8; --err:#ff6b6b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    -webkit-text-size-adjust:100%}
  body{min-height:100vh}

  /* ===== 鍵の画面 ===== */
  #lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
  #lockbox{width:100%;max-width:340px;text-align:center}
  #lockbox h1{font-size:20px;font-weight:600;margin:0 0 6px}
  #lockbox p.sub{color:var(--dim);font-size:13px;margin:0 0 22px;line-height:1.6}
  .field{display:flex;gap:8px}
  input[type=password]{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);
    color:var(--fg);border-radius:10px;padding:14px;font-size:16px;outline:none}
  input[type=password]:focus{border-color:var(--accent)}
  button{appearance:none;border:0;border-radius:10px;background:var(--accent);color:#fff;
    font-size:15px;font-weight:600;padding:14px 18px;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  #msg{min-height:20px;margin-top:14px;font-size:13px;color:var(--err)}
  #msg.work{color:var(--dim)}

  /* ===== 一覧 ===== */
  header{position:sticky;top:0;background:rgba(20,22,26,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:baseline;gap:10px;z-index:10}
  header b{font-size:16px;font-weight:600}
  header span{font-size:12px;color:var(--dim)}
  #grid{display:grid;gap:3px;padding:3px;
    grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
  @media(min-width:700px){#grid{gap:6px;padding:6px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}}
  .cell{position:relative;aspect-ratio:1/1;background:var(--panel);overflow:hidden;cursor:pointer;
    border-radius:4px}
  .cell img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .25s}
  .cell img.on{opacity:1}
  footer{padding:28px 16px 40px;text-align:center;color:var(--dim);font-size:11px}

  /* ===== 拡大表示 ===== */
  #view{position:fixed;inset:0;background:#000;display:none;z-index:40;
    align-items:center;justify-content:center;touch-action:pan-y}
  #view.open{display:flex}
  #view img{max-width:100%;max-height:100%;object-fit:contain;image-orientation:from-image}
  #cap{position:absolute;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(transparent,rgba(0,0,0,.75));font-size:13px;text-align:center}
  #cap .d{color:var(--dim);font-size:11px;margin-top:2px}
  .nav{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;
    background:rgba(255,255,255,.12);color:#fff;font-size:22px;display:flex;align-items:center;
    justify-content:center;cursor:pointer;user-select:none}
  #prev{left:10px} #next{right:10px}
  #close{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;width:44px;height:44px;
    border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:20px;display:flex;
    align-items:center;justify-content:center;cursor:pointer;user-select:none}
  #spin{position:absolute;color:var(--dim);font-size:13px}
  .hide{display:none !important}
</style>
</head>
<body>

<div id="lock">
  <div id="lockbox">
    <h1>写真</h1>
    <p class="sub">パスワードを入れてください。<br>写真は暗号のまま置いてあるので、<br>パスワードがないと誰も見られません。</p>
    <form class="field" id="form" autocomplete="off">
      <input type="password" id="pw" placeholder="パスワード" autocomplete="current-password" enterkeyhint="go">
      <button type="submit" id="go">ひらく</button>
    </form>
    <div id="msg"></div>
  </div>
</div>

<div id="app" class="hide">
  <header><b>写真</b><span id="info"></span></header>
  <div id="grid"></div>
  <footer>v1.0.0</footer>
</div>

<div id="view">
  <img id="big" alt="">
  <div id="spin">よみこみ中…</div>
  <div id="cap"><div class="n"></div><div class="d"></div></div>
  <div class="nav" id="prev">‹</div>
  <div class="nav" id="next">›</div>
  <div id="close">✕</div>
</div>

<script>
"use strict";
var VERIFY_MSG = "photo-vault-verify";
var keys = null, items = [], meta = null, cur = -1;
var fullCache = {};   // 拡大画像のURLを覚えておく（2回目は即表示）

var $ = function(s){ return document.querySelector(s); };
var msg = $("#msg");

function hex2buf(h){
  var a = new Uint8Array(h.length/2);
  for(var i=0;i<a.length;i++) a[i] = parseInt(h.substr(i*2,2),16);
  return a;
}
function buf2hex(b){
  return Array.prototype.map.call(new Uint8Array(b), function(x){
    return ("0"+x.toString(16)).slice(-2); }).join("");
}

async function deriveKeys(pw){
  var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw),
                                           "PBKDF2", false, ["deriveBits"]);
  var bits = await crypto.subtle.deriveBits(
    { name:"PBKDF2", salt: hex2buf(meta.salt), iterations: meta.iters, hash:"SHA-256" },
    base, 512);
  return {
    enc: await crypto.subtle.importKey("raw", bits.slice(0,32), {name:"AES-CTR"}, false, ["decrypt"]),
    mac: await crypto.subtle.importKey("raw", bits.slice(32,64), {name:"HMAC",hash:"SHA-256"},
                                        false, ["sign"])
  };
}

async function open_(buf){
  var u = new Uint8Array(buf);
  if(u.length < 48) throw new Error("ファイルが壊れています");
  var iv = u.subarray(0,16), tag = u.subarray(16,48), ct = u.subarray(48);
  var signed = new Uint8Array(16 + ct.length);
  signed.set(iv,0); signed.set(ct,16);
  var want = await crypto.subtle.sign("HMAC", keys.mac, signed);
  if(buf2hex(want) !== buf2hex(tag)) throw new Error("鍵が合いません");
  return await crypto.subtle.decrypt({name:"AES-CTR", counter:iv, length:128}, keys.enc, ct);
}

async function fetchOpen(path){
  var r = await fetch(path, {cache:"force-cache"});
  if(!r.ok) throw new Error(path + " が読めません (" + r.status + ")");
  return await open_(await r.arrayBuffer());
}
function toURL(buf){
  return URL.createObjectURL(new Blob([buf], {type:"image/jpeg"}));
}

/* ---------- 一覧 ---------- */
var io = null;
function buildGrid(){
  var grid = $("#grid");
  grid.textContent = "";
  io = new IntersectionObserver(function(es){
    es.forEach(function(e){
      if(!e.isIntersecting) return;
      io.unobserve(e.target);
      var idx = +e.target.dataset.i;
      fetchOpen("d/" + items[idx].t).then(function(buf){
        var img = e.target.querySelector("img");
        img.src = toURL(buf);
        img.onload = function(){ img.classList.add("on"); };
      }).catch(function(err){ console.error(err); });
    });
  }, {rootMargin:"400px"});

  items.forEach(function(it, i){
    var d = document.createElement("div");
    d.className = "cell"; d.dataset.i = i;
    d.innerHTML = '<img alt="">';
    d.onclick = function(){ show(i); };
    grid.appendChild(d);
    io.observe(d);
  });
  $("#info").textContent = items.length + "枚 ・ " + (meta.built || "");
}

/* ---------- 拡大 ---------- */
async function show(i){
  if(i < 0 || i >= items.length) return;
  cur = i;
  var it = items[i];
  $("#view").classList.add("open");
  $("#cap").querySelector(".n").textContent = it.n || "";
  $("#cap").querySelector(".d").textContent = (it.d || "") + "　" + (i+1) + " / " + items.length;
  var big = $("#big");
  if(fullCache[it.f]){
    big.src = fullCache[it.f]; $("#spin").classList.add("hide");
  }else{
    big.removeAttribute("src"); $("#spin").classList.remove("hide");
    try{
      var buf = await fetchOpen("d/" + it.f);
      if(cur !== i) return;               // 連打で切り替わっていたら捨てる
      fullCache[it.f] = toURL(buf);
      big.src = fullCache[it.f];
    }catch(e){
      $("#spin").textContent = "この写真は開けませんでした";
      return;
    }
    $("#spin").classList.add("hide");
  }
  // 隣を先読み
  [i+1, i-1].forEach(function(j){
    if(j<0 || j>=items.length) return;
    var f = items[j].f;
    if(fullCache[f]) return;
    fetchOpen("d/"+f).then(function(b){ fullCache[f] = toURL(b); }).catch(function(){});
  });
}
function closeView(){ $("#view").classList.remove("open"); $("#big").removeAttribute("src"); cur = -1; }

$("#prev").onclick = function(e){ e.stopPropagation(); show(cur-1); };
$("#next").onclick = function(e){ e.stopPropagation(); show(cur+1); };
$("#close").onclick = function(e){ e.stopPropagation(); closeView(); };
$("#view").onclick = function(e){ if(e.target.id === "view") closeView(); };
document.addEventListener("keydown", function(e){
  if(!$("#view").classList.contains("open")) return;
  if(e.key === "Escape") closeView();
  if(e.key === "ArrowRight") show(cur+1);
  if(e.key === "ArrowLeft") show(cur-1);
});
// スワイプ
var sx = null, sy = null;
$("#view").addEventListener("touchstart", function(e){
  sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
$("#view").addEventListener("touchend", function(e){
  if(sx === null) return;
  var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) show(cur + (dx < 0 ? 1 : -1));
  else if(dy > 90 && Math.abs(dy) > Math.abs(dx)) closeView();
  sx = sy = null;
}, {passive:true});

/* ---------- 開錠 ---------- */
$("#form").onsubmit = async function(e){
  e.preventDefault();
  var pw = $("#pw").value;
  if(!pw) return;
  $("#go").disabled = true;
  msg.className = "work"; msg.textContent = "かぎを作っています…";
  try{
    keys = await deriveKeys(pw);
    var check = buf2hex(await crypto.subtle.sign("HMAC", keys.mac,
                      new TextEncoder().encode(VERIFY_MSG)));
    if(check !== meta.verify) throw new Error("ちがう");
    msg.textContent = "よみこみ中…";
    var man = JSON.parse(new TextDecoder().decode(await fetchOpen("manifest.bin")));
    items = man.items || [];
    $("#pw").value = "";
    $("#lock").classList.add("hide");
    $("#app").classList.remove("hide");
    buildGrid();
  }catch(err){
    keys = null;
    msg.className = ""; msg.textContent = "パスワードが違います";
    $("#pw").select();
  }
  $("#go").disabled = false;
};

/* ---------- 起動 ---------- */
(async function(){
  if(!window.crypto || !crypto.subtle){
    msg.className = ""; msg.textContent = "このブラウザでは表示できません（httpsで開いてください）";
    $("#go").disabled = true; return;
  }
  try{
    meta = await (await fetch("meta.json", {cache:"no-cache"})).json();
  }catch(e){
    msg.className = ""; msg.textContent = "まだ写真が置かれていません";
    $("#go").disabled = true; return;
  }
  $("#pw").focus();
})();
</script>
</body>
</html>
